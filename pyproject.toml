[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd-from-scratch"
version = "0.1.0"
description = "A tiny scalar automatic differentiation engine and neural network library built from scratch."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "graphviz",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
